<main class="login-page">
  <section class="login-card">
    <h1>💰 存股分析</h1>
    <p>使用 Google 帳號登入，保留你自己的收藏、估值設定與檢視筆記。</p>
    <div #googleButton class="google-button" [attr.aria-busy]="loading()"></div>
    @if (error()) { <p class="error" role="alert">{{ error() }}</p> }
    @if (loading()) { <p role="status">登入中…</p> }
    <p class="privacy-note">
      登入前請先閱讀本站的<a routerLink="/privacy">隱私權政策</a>，了解基本帳號資料與個人內容的使用方式。
    </p>
    <nav class="public-links" aria-label="公開資訊">
      <a routerLink="/about">關於本站</a>
      <a routerLink="/privacy">隱私權政策</a>
    </nav>
  </section>
</main>
